<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlantUML Local Renderer</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: transparent; }
  </style>
</head>
<body>
  <!--
    Renderer PlantUML lokal (TeaVM JS) untuk web.
    Berjalan di dalam <iframe> tersembunyi.
    - viz-global.js  : engine Graphviz/Viz.js (wajib untuk layout Dot).
    - plantuml.js    : engine PlantUML (ES module), export render & renderToString.
    Dipanggil dari parent via window.renderPlantUML(linesJson).
    Hasil dikirim balik lewat window.parent.postMessage(..., '*').
  -->
  <script src="viz-global.js"></script>
  <script type="module">
    import { renderToString } from './plantuml.js';

    // Signal parent that the engine is ready
    window.parent.postMessage(JSON.stringify({ type: 'ready' }), '*');

    window.renderPlantUML = function (arg) {
      let lines;
      if (Array.isArray(arg)) {
        lines = arg;
      } else {
        try {
          lines = JSON.parse(arg);
        } catch (e) {
          lines = String(arg).split(/\r\n|\r|\n/);
        }
      }
      renderToString(
        lines,
        function (svg) {
          window.parent.postMessage(JSON.stringify({ ok: true, svg: svg }), '*');
        },
        function (err) {
          window.parent.postMessage(JSON.stringify({ ok: false, err: String(err) }), '*');
        }
      );
    };
  </script>
</body>
</html>
